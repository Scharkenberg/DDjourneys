name: main (all eight targets)

# On demand only. For everyday builds use mostcommon.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        configuration: [Debug, Release]
    uses: ./.github/workflows/_android.yml
    with:
      architecture: ${{ matrix.architecture }}
      configuration: ${{ matrix.configuration }}

  windows:
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
        configuration: [Debug, Release]
    uses: ./.github/workflows/_windows.yml
    with:
      architecture: ${{ matrix.architecture }}
      configuration: ${{ matrix.configuration }}
