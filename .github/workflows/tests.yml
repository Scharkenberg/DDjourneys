name: tests

# The unit tests (plain .NET, no MAUI): the same project and command as locally.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.100-rc.1.26425.128
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj
      - name: Test
        run: dotnet test DDjourneys.Tracking.Tests/DDjourneys.Tracking.Tests.csproj -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DDjourneys-tests
          path: TestResults
          if-no-files-found: warn
