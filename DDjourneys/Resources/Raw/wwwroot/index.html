<script>
/* Diagnostics, plain ES5 on purpose: it has to run on the oldest WebView, before anything else is loaded.
   Everything goes to window.ddLog (kept in memory, handed to the app as "log:" messages once the bridge exists,
   and readable by the app through ddDump() even when the bridge never came up). */
(function () {
	var t0 = new Date().getTime(), kept = [], waiting = [], MAX = 600;

	function stamp() { return '[' + (new Date().getTime() - t0) + ' ms] '; }

	function post(line) {
		try {
			if (window.HybridWebView && window.HybridWebView.SendRawMessage) { window.HybridWebView.SendRawMessage('log:' + line); return true; }
		} catch (e) { }
		return false;
	}

	window.ddLog = function (text) {
		var line = stamp() + text;
		kept.push(line);
		if (kept.length > MAX) { kept.shift(); }
		if (!post(line)) { waiting.push(line); }
	};

	window.ddFlush = function () {
		var rest = waiting; waiting = [];
		for (var i = 0; i < rest.length; i++) { if (!post(rest[i])) { waiting.push(rest[i]); } }
	};

	window.ddDump = function () { return kept.join('\n'); };

	function text(value) {
		try { return typeof value === 'string' ? value : JSON.stringify(value); } catch (e) { return String(value); }
	}

	// Errors: scripts and styles that fail to load or parse (a SyntaxError names the file and the line), and promises nobody handled.
	window.addEventListener('error', function (e) {
		var t = e.target;
		if (t && t !== window && (t.src || t.href)) { window.ddLog('resource failed: <' + t.tagName + '> ' + (t.src || t.href)); return; }
		window.ddLog('error: ' + e.message + ' at ' + e.filename + ':' + e.lineno + ':' + e.colno + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
	}, true);
	window.addEventListener('unhandledrejection', function (e) {
		window.ddLog('unhandled rejection: ' + (e.reason && e.reason.stack ? e.reason.stack : text(e.reason)));
	});
	window.addEventListener('webglcontextcreationerror', function (e) {
		window.ddLog('webglcontextcreationerror: ' + (e && e.statusMessage));
	}, true);
	window.addEventListener('webglcontextlost', function () { window.ddLog('webglcontextlost'); }, true);
	window.addEventListener('webglcontextrestored', function () { window.ddLog('webglcontextrestored'); }, true);

	['warn', 'error'].forEach(function (level) {
		var original = console[level];
		console[level] = function () {
			try { window.ddLog('console.' + level + ': ' + Array.prototype.slice.call(arguments).map(text).join(' ')); } catch (e) { }
			if (original) { try { original.apply(console, arguments); } catch (e) { } }
		};
	});

	// What this engine can do: the language features maplibre-gl.js is written in, the APIs it uses, and WebGL.
	function probe() {
		var ua = navigator.userAgent, chrome = /Chrome\/(\d+)/.exec(ua);
		window.ddLog('engine: ' + ua);
		window.ddLog('engine: chromium ' + (chrome ? chrome[1] : 'unknown') + ', secure=' + window.isSecureContext + ', dpr=' + window.devicePixelRatio
			+ ', screen=' + screen.width + 'x' + screen.height + ', inner=' + window.innerWidth + 'x' + window.innerHeight
			+ ', cores=' + navigator.hardwareConcurrency + ', memory=' + navigator.deviceMemory + ' GB');
		window.ddLog('page: ' + location.href + ', readyState=' + document.readyState);

		var syntax = {
			'optional chaining': 'var a={};return a?.b',
			'nullish coalescing': 'var a=null;return a??1',
			'async/await': 'async function f(){await 1}',
			'object spread': 'var a={};return {...a}',
			'optional catch binding': 'try{}catch{}',
			'class fields': 'class A{x=1}',
			'private fields': 'class A{#x=1}',
			'static blocks': 'class A{static{}}',
			'exponent operator': 'return 2**2',
			'numeric separator': 'return 1_0',
			'bigint literal': 'return 1n',
			'logical assignment': 'var a=0;a||=1',
			'regexp lookbehind': 'return /(?<=a)b/',
			'regexp named groups': 'return /(?<x>a)/',
			'regexp unicode property': 'return /\\p{L}/u',
			'array destructuring': 'var [a]=[1]',
			'template literal': 'return `a`',
			'arrow function': 'return ()=>1'
		}, failed = [], passed = 0;
		var required = ['optional chaining', 'nullish coalescing', 'async/await', 'object spread', 'optional catch binding'], missingRequired = [];
		for (var name in syntax) {
			try { new Function(syntax[name]); passed++; } catch (e) { failed.push(name + ' (' + e.message + ')'); if (required.indexOf(name) >= 0) { missingRequired.push(name); } }
		}
		window.ddLog('syntax: ' + passed + ' supported' + (failed.length ? ', NOT supported: ' + failed.join('; ') : ''));

		var apis = ['Promise', 'fetch', 'Symbol', 'Map', 'Set', 'WeakMap', 'Proxy', 'Reflect', 'ResizeObserver', 'IntersectionObserver', 'URL', 'URLSearchParams',
			'AbortController', 'TextDecoder', 'Blob', 'Worker', 'WebAssembly', 'createImageBitmap', 'OffscreenCanvas', 'BigInt', 'queueMicrotask', 'structuredClone',
			'requestAnimationFrame', 'matchMedia', 'DOMMatrix', 'ImageData', 'Float32Array', 'Uint32Array', 'ArrayBuffer', 'SharedArrayBuffer'], missing = [];
		for (var i = 0; i < apis.length; i++) { if (typeof window[apis[i]] === 'undefined') { missing.push(apis[i]); } }
		var methods = { 'Object.assign': Object.assign, 'Object.entries': Object.entries, 'Object.fromEntries': Object.fromEntries, 'Array.from': Array.from,
			'Array.prototype.includes': Array.prototype.includes, 'Array.prototype.flat': Array.prototype.flat, 'String.prototype.padStart': String.prototype.padStart,
			'String.prototype.replaceAll': String.prototype.replaceAll, 'Promise.allSettled': window.Promise && Promise.allSettled, 'Element.prototype.closest': Element.prototype.closest };
		for (var m in methods) { if (!methods[m]) { missing.push(m); } }
		window.ddLog('apis: ' + (missing.length ? 'missing ' + missing.join(', ') : 'all present'));

		var gl2 = false, names = ['webgl2', 'webgl', 'experimental-webgl'];
		for (var n = 0; n < names.length; n++) {
			try {
				var canvas = document.createElement('canvas');
				canvas.addEventListener('webglcontextcreationerror', function (e) { window.ddLog('webgl probe: creation error: ' + e.statusMessage); });
				var gl = canvas.getContext(names[n], { failIfMajorPerformanceCaveat: false });
				if (!gl) { window.ddLog('webgl probe: ' + names[n] + ' unavailable'); continue; }
				if (names[n] === 'webgl2') { gl2 = true; }
				var info = gl.getExtension('WEBGL_debug_renderer_info');
				window.ddLog('webgl probe: ' + names[n] + ' ok, version=' + gl.getParameter(gl.VERSION) + ', glsl=' + gl.getParameter(gl.SHADING_LANGUAGE_VERSION)
					+ ', vendor=' + gl.getParameter(info ? info.UNMASKED_VENDOR_WEBGL : gl.VENDOR) + ', renderer=' + gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER)
					+ ', maxTexture=' + gl.getParameter(gl.MAX_TEXTURE_SIZE) + ', maxRenderbuffer=' + gl.getParameter(gl.MAX_RENDERBUFFER_SIZE)
					+ ', maxVertexAttribs=' + gl.getParameter(gl.MAX_VERTEX_ATTRIBS) + ', extensions=' + (gl.getSupportedExtensions() || []).length + ', lost=' + gl.isContextLost());
				var lose = gl.getExtension('WEBGL_lose_context');
				if (lose) { lose.loseContext(); }
			} catch (e) { window.ddLog('webgl probe: ' + names[n] + ' threw ' + e.message); }
		}

		// MapLibre GL 5 (engine "carto") needs WebGL 2 and these language features. Without them the library is not
		// loaded unless the app says "force": it would fail (or take the web view down). Leaflet needs neither.
		if (missingRequired.length) { window.ddUnsupported = 'JavaScript engine too old (Chromium ' + (chrome ? chrome[1] : '?') + '): ' + missingRequired.join(', '); }
		else if (!gl2) { window.ddUnsupported = 'WebGL 2 is not available'; }
	}

	try { probe(); } catch (e) { window.ddLog('probe failed: ' + e.message); }

	document.addEventListener('DOMContentLoaded', function () { window.ddLog('DOMContentLoaded'); });
	window.addEventListener('load', function () { window.ddLog('load: hybridwebview=' + typeof window.HybridWebView + ', maplibregl=' + typeof window.maplibregl); window.ddFlush(); });
}());
</script>

<script>
// The page waits for the app: it says "boot" once the bridge exists, the app answers ddBoot('start', {engine, force}),
// and only then the chosen library is loaded: "carto" = MapLibre GL (vector, WebGL 2, only when the checks above
// pass or the app forces it), "leaflet" = Leaflet (raster tiles, any web view). Then ddMain(engine) runs and says "ready".
(function () {
	var started = false;

	function say(text) { try { window.HybridWebView.SendRawMessage(text); } catch (e) { } }

	function fail(reason) {
		window.ddLog('map not started: ' + reason);
		window.ddFlush();
		say('unsupported:' + reason);
	}

	function load(src, done, css) {
		if (css) {
			var link = document.createElement('link');
			link.rel = 'stylesheet';
			link.href = css;
			document.head.appendChild(link);
		}

		var script = document.createElement('script');
		script.onload = done;
		script.onerror = function () { fail(src + ' could not be loaded'); };
		script.src = src;
		document.head.appendChild(script);
	}

	window.ddBoot = function (command, json) {
		var arg = json ? JSON.parse(json) : {};

		window.ddLog('ddBoot ' + command + ' ' + (json || ''));

		if (command !== 'start' || started) { return; }

		if (arg.engine === 'leaflet') {
			started = true;
			load('leaflet/leaflet.js', function () {
				window.ddLog('leaflet.js: ' + typeof window.L + (window.L ? ' ' + window.L.version : ' (did not run: see the errors above)'));
				if (window.L) { window.ddMain('leaflet'); } else { started = false; fail('leaflet.js did not start'); }
			}, 'leaflet/leaflet.css');
			return;
		}

		if (window.ddUnsupported && !arg.force) { fail(window.ddUnsupported); return; }

		if (window.ddUnsupported) { window.ddLog('forced past: ' + window.ddUnsupported); }

		started = true;
		load('maplibre/maplibre-gl.js', function () {
			window.ddLog('maplibre-gl.js: ' + typeof window.maplibregl + (window.maplibregl ? ' ' + window.maplibregl.version : ' (did not run: see the errors above)'));
			if (window.maplibregl) { window.ddMain('carto'); } else { started = false; fail('maplibre-gl.js did not start'); }
		});
	};

	window.ddLog('boot: asking the app which engine to start');
	say('boot');
}());
</script>
<style>
/* The app's own fonts (the same files the app ships), so the map reads like the rest of the UI. */
@font-face { font-family: "DD Open Sans"; font-weight: 400; src: url("fonts/OpenSans-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "DD Open Sans"; font-weight: 600 800; src: url("fonts/OpenSans-Semibold.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "DD Inter Tight"; font-weight: 400; src: url("fonts/InterTight-Regular.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "DD Inter Tight"; font-weight: 600 800; src: url("fonts/InterTight-SemiBold.ttf") format("truetype"); font-display: swap; }
:root {
	--font: "DD Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	--fs: 1;
	--bg: #f2f4f5; --surface: #ffffff; --raised: #dfe6e9; --outline: #b4c1c7;
	--ink: #0f1a1f; --ink-muted: #4a5960; --accent: #0b6e8a; --accent-soft: #d3e9f0;
	--radius: 4px; --radius-card: 6px;
}
html { font-size: calc(15px * var(--fs)); }
html, body, #map { height: 100%; margin: 0; padding: 0; background: var(--bg); }
body { font: 1rem/1.4 var(--font); color: var(--ink); overflow: hidden; -webkit-text-size-adjust: 100%; }
.maplibregl-ctrl, .maplibregl-popup, .maplibregl-ctrl button { font-family: var(--font); }

/* Controls and popups follow the app theme: flat, sharp corners, outline instead of shadow. */

.maplibregl-ctrl-group:not(:empty) { box-shadow: none; }
.maplibregl-ctrl-group button + button { border-top: 1px solid var(--outline); }
.maplibregl-ctrl-group button:not(:disabled):hover { background: var(--accent-soft); }

/* Leaflet (the other engine) wears the same clothes: flat bars, outline instead of shadow, popups in the app's colours. */
.leaflet-container { background: var(--bg); font: inherit; font-family: var(--font); outline: 0; }
/* The prefix .leaflet-container wins over leaflet.css whichever file is read last (it is loaded after this block, with the
   same or a higher specificity: the zoom buttons were white with black symbols in the dark theme). */
.leaflet-container .leaflet-bar, .leaflet-touch .leaflet-container .leaflet-bar { background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius); box-shadow: none; background-clip: border-box; }
.leaflet-container .leaflet-bar a, .leaflet-container .leaflet-bar a:visited { background-color: var(--surface); color: var(--ink); border-bottom: 1px solid var(--outline); font-family: var(--font); cursor: pointer; text-decoration: none; }
.leaflet-container .leaflet-bar a:first-child { border-top-left-radius: 0; border-top-right-radius: 0; }
.leaflet-container .leaflet-bar a:last-child { border-bottom: 0; border-radius: 0; }
.leaflet-container .leaflet-bar a:hover, .leaflet-container .leaflet-bar a:focus { background-color: var(--accent-soft); color: var(--ink); }
.leaflet-container .leaflet-bar a.leaflet-disabled, .leaflet-container .leaflet-bar a.leaflet-disabled:hover { background-color: var(--surface); color: var(--ink-muted); opacity: .5; cursor: default; }
.leaflet-touch .leaflet-container .leaflet-bar a, .leaflet-container.leaflet-touch .leaflet-bar a { width: 30px; height: 30px; line-height: 30px; }
.leaflet-container .leaflet-bar.dd-fitnow { border: 1px solid var(--outline); }
.leaflet-control.dd-fit, .leaflet-control.dd-attr { box-shadow: none; }
.dd-licon { background: none; border: 0; overflow: visible; }
.dd-popup .leaflet-popup-content-wrapper { background: var(--surface); color: var(--ink); border: 1px solid var(--outline); border-radius: var(--radius-card); box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.dd-popup .leaflet-popup-content { margin: 8px 12px; font: inherit; line-height: 1.4; }
.dd-popup .leaflet-popup-tip { background: var(--surface); border: 1px solid var(--outline); box-shadow: none; }
.dd-attr { position: relative; margin: 0 6px 6px 0; }
.dd-attr > button { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--outline); background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink-muted);
	font: 700 13px/1 Georgia, serif; font-style: italic; cursor: pointer; padding: 0; display: block; margin-left: auto; }
.dd-attr > div { display: none; position: absolute; right: 0; bottom: 28px; white-space: nowrap; background: var(--surface); color: var(--ink-muted); border: 1px solid var(--outline);
	border-radius: var(--radius); padding: 4px 8px; font-size: .85rem; line-height: 1.3; }
.dd-attr.open > div { display: block; }
.dd-attr a { color: var(--ink); text-decoration: underline; }
/* Layers: the map's own switch panel, filled by the app; hidden entirely while it has no rows. The panel

.dd-layers { position: relative; }
.dd-layers > button { background: var(--surface); border: 0; cursor: pointer; width: 30px; height: 30px; padding: 0; display: none; align-items: center; justify-content: center; }

.dd-layers > button svg .solid { fill: var(--ink); stroke: none; }
.dd-layers > div { position: absolute; right: 0; top: 34px; min-width: 232px; max-height: min(60vh, 340px); overflow-y: auto; background: var(--surface); color: var(--ink);
	border: 1px solid var(--outline); border-radius: var(--radius); padding: 4px; z-index: 5; box-shadow: 0 4px 16px rgba(0,0,0,.25);
	opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events: none;

.dd-layers.open > div { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition-delay: 0s; }

	font: 600 .95rem/1.2 var(--font); text-align: left; cursor: pointer; border-radius: var(--radius); }
.dd-layers .row:hover { background: var(--accent-soft); }

.dd-layers .row span { flex: 1; min-width: 0; }
.dd-layers .row i { width: 20px; height: 20px; border: 2px solid var(--ink-muted); border-radius: 5px; box-sizing: border-box; flex: none; position: relative; transition: background-color .12s ease, border-color .12s ease; }
.dd-layers .row.on i { background: var(--accent); border-color: var(--accent); }
.dd-layers .row.on i::after { content: ''; position: absolute; left: 5px; top: 1px; width: 4px; height: 9px; border: solid var(--on-accent, #fff); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.dd-layers .row.link i { display: none; }
.dd-layers .row.link::after { content: '\203A'; color: var(--ink-muted); font-size: 1.3rem; line-height: 1; }
.dd-layers .rule { height: 1px; margin: 4px 8px; background: var(--outline); }
@media (pointer: coarse) {
	.dd-layers > button, .dd-fitnow button { width: 40px; height: 40px; }
	.maplibregl-ctrl-group button { width: 40px; height: 40px; }
	.leaflet-container .leaflet-bar a { width: 40px; height: 40px; line-height: 40px; }
	.dd-layers > div { top: 44px; }
}
@media (prefers-reduced-motion: reduce) {
	.dd-layers > div, .dd-layers .row i { transition: none; }
}
/* Zone numbers on the map: quiet, and only from this zoom on (see updateLabelZoom). */
.dd-zlicon { background: none; border: 0; }
.dd-zone-label { position: absolute; transform: translate(-50%, -50%); font: 700 calc(.8rem * var(--fs))/1 var(--font); color: var(--ink);
	text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg), 0 0 3px var(--bg); pointer-events: none; display: none; }

	color: var(--ink); font-family: inherit; font-weight: 600; font-size: .95rem; line-height: 1; cursor: pointer; }
.dd-fit button i { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-muted); box-sizing: border-box; display: block; }
.dd-fit button.on { background: var(--accent-soft); border-color: var(--accent); }
.dd-fit button.on i { background: var(--accent); border-color: var(--accent); }
.dd-fitnow button { background: var(--surface); border: 0; cursor: pointer; width: 30px; height: 30px; padding: 0; display: flex; align-items: center; justify-content: center; }
.dd-fitnow svg { width: 18px; height: 18px; stroke: var(--ink); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.maplibregl-popup-content { background: var(--surface); color: var(--ink); border: 1px solid var(--outline); border-radius: var(--radius-card); box-shadow: 0 2px 10px rgba(0,0,0,.25); padding: 8px 12px; font: inherit; }
.maplibregl-popup-anchor-top .maplibregl-popup-tip { border-bottom-color: var(--surface); }
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip { border-top-color: var(--surface); }
.maplibregl-popup-anchor-left .maplibregl-popup-tip { border-right-color: var(--surface); }
.maplibregl-popup-anchor-right .maplibregl-popup-tip { border-left-color: var(--surface); }
.dd-pop b { display: block; font-weight: 700; font-size: 1.05rem; }

.dd-veh { font-weight: 700; font-size: 1.05rem; line-height: 1.5rem; height: 1.8rem; min-width: 2.4rem; padding: 0 .5rem; text-align: center; white-space: nowrap; border-radius: var(--radius-card); border: 2px solid var(--surface); box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 1px 5px rgba(0,0,0,.5); transform: translate(-50%, -50%); position: absolute; left: 0; top: 0; box-sizing: border-box; }
/* A park &amp; ride site (square with a P) or a bike station (Tier 2): the site is named from zoom 13 and
   carries its counts from zoom 14 - the short form below, the full form at the stops' zoom (see .zz/.zl). */
.dd-parking { width: 18px; height: 18px; border-radius: 5px; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--surface); font: 700 .7rem/1 var(--font); line-height: 14px; text-align: center; color: var(--ink); }
.dd-lbl.dd-site .s, .dd-lbl.dd-site .f { display: none; }
.zz .dd-m .dd-lbl.dd-site { display: block; }
.zz .dd-lbl.dd-site .s { display: inline; }
.zl .dd-lbl.dd-site .s { display: none; }
.zl .dd-lbl.dd-site .f { display: inline; }
.dd-bike { width: 18px; height: 18px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--surface); }
.dd-bike svg { display: block; width: 12px; height: 12px; margin: 1px auto 0; stroke: var(--ink); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>
<div id="map"></div>
<script>
window.ddMain = function (engineName) {
	'use strict';

	var map = null, key = '', theme = null, styleName = null, styleReady = false;
	var autoFit = true, labels = { autoFit: 'Auto-fit', fitNow: 'Fit', info: 'Map data' }, autoButton = null;
	var scene = { markers: [], lines: [] }, wantFit = false;
	var markers = {}, explore = false, pickMode = false, pendingCenter = null, viewTimer = 0;
	var errors = 0, firstRender = false, firstStyle = false, firstIdle = false;
	var engine = engineName, gl = engine === 'carto', eng = null, tiles = null, lineGroup = null, shapeGroup = null, programmatic = 0;

	// Layers: one group per id (markers, polygons, labels), sent once by the app instead of on every viewport
	// change. Layer ids are marker-id namespaces: "stops" for the stops in view, Tier 2 uses p:/b:/v: prefixes.
	var layerPayloads = {}, layerStores = {}, layerPolyGroups = {}, layerLabelMarkers = {}, layerHadShapes = {};
	var layerRows = null, layerState = {}, layerTitle = '', layerButton = null, layerPanel = null;

	function dd(text) { if (window.ddLog) { window.ddLog(text); } }

	function send(text) {
		try { window.HybridWebView.SendRawMessage(text); } catch (e) { }
	}

	window.addEventListener('error', function (e) { send('error:' + e.message); });

	// Links (attribution, popups) open in the system browser, not in this page.
	document.addEventListener('click', function (e) {
		var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;

		// Buttons that are anchors (the zoom control of Leaflet is href="#"): the page must never navigate, or the app opens
		// the base address of the page in the browser. The control's own handler still runs (default action only).
		if (a && /^#?$/.test(a.getAttribute('href') || '')) {
			e.preventDefault();

			return;
		}

		if (a && /^https?:/i.test(a.href)) {
			e.preventDefault();
			send('open:' + a.href);
		}
	}, true);

	// ---- colour helpers ----
	function rgb(hex) {
		hex = String(hex || '#000000').replace('#', '');
		if (hex.length === 3) { hex = hex.replace(/(.)/g, '$1$1'); }
		var n = parseInt(hex.substring(0, 6), 16);
		return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
	}
	function mix(a, b, t) {
		var x = rgb(a), y = rgb(b);
		var c = [0, 1, 2].map(function (i) { return Math.round(x[i] + (y[i] - x[i]) * t); });
		return '#' + c.map(function (v) { return ('0' + v.toString(16)).slice(-2); }).join('');
	}

	// WCAG contrast: text on a coloured pill is black or white, whichever reads better on that colour.
	function luminance(hex) {
		var c = rgb(hex).map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
		return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
	}
	function contrast(a, b) {
		var la = luminance(a), lb = luminance(b);
		return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05);
	}
	function readableInk(bg) {
		return contrast(bg, '#ffffff') >= contrast(bg, '#0b0b0b') ? '#ffffff' : '#0b0b0b';
	}

	// The basemap's colours, derived from the app theme so the map looks like part of the app.
	function palette(t) {
		var d = !!t.dark;
		var water = mix(t.bg, t.accent, d ? 0.30 : 0.26);
		return {
			land: t.bg,
			landAlt: mix(t.bg, t.surface, d ? 0.7 : 0.55),
			water: water,
			waterLabel: mix(water, t.ink, 0.6),
			park: mix(t.bg, t.ok, d ? 0.20 : 0.24),
			building: mix(t.bg, t.outline, d ? 0.24 : 0.20),
			buildingEdge: mix(t.bg, t.outline, d ? 0.40 : 0.34),
			roadMinor: d ? t.raised : t.surface,
			roadMajor: d ? mix(t.raised, t.ink, 0.22) : mix(t.surface, t.accent, 0.10),
			casing: mix(t.bg, t.outline, d ? 0.55 : 0.45),
			rail: mix(t.bg, t.inkMuted, 0.65),
			boundary: mix(t.bg, t.outline, 0.9),
			label: t.ink,
			labelMuted: t.inkMuted,
			halo: t.bg
		};
	}

	// ---- typography ----
	var baseSizes = {};

	function fontStack(id) {
		if (id === 'intertight') { return '"DD Inter Tight", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; }
		if (id === 'system') { return 'system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'; }

		return '"DD Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
	}

	// Scales the outputs of a text-size value (number, legacy stops, or an interpolate/step expression on zoom).
	function scaleSize(v, k) {
		if (typeof v === 'number') { return v * k; }

		if (Array.isArray(v)) {
			if (/^interpolate/.test(v[0])) {
				return v.map(function (x, i) { return (i >= 4 && i % 2 === 0) ? scaleSize(x, k) : x; });
			}

			if (v[0] === 'step') {
				return v.map(function (x, i) { return (i === 2 || (i >= 4 && i % 2 === 0)) ? scaleSize(x, k) : x; });
			}

			return v;
		}

		if (v && Array.isArray(v.stops)) {
			var o = JSON.parse(JSON.stringify(v));
			o.stops = o.stops.map(function (s) { return [s[0], scaleSize(s[1], k)]; });

			return o;
		}

		return v;
	}

	// Basemap labels are drawn by the map from CARTO's glyphs (their font cannot be swapped), but their size
	// follows the OS text size, and a little more than the style's own, which reads small on a phone.
	function scaleText(id) {
		if (!(id in baseSizes)) {
			var current = map.getLayoutProperty(id, 'text-size');
			baseSizes[id] = current === undefined ? 16 : current;
		}

		var k = Math.min(1.8, 1.15 * ((theme && theme.fontScale) || 1));

		try { map.setLayoutProperty(id, 'text-size', scaleSize(baseSizes[id], k)); } catch (e) { }
	}

	function paint(id, prop, value) {
		try { map.setPaintProperty(id, prop, value); } catch (e) { }
	}

	// Recolours the loaded vector style by layer role. Roles are recognised from the layer ids of the
	// CARTO styles (OpenMapTiles schema); a layer that matches nothing keeps its original colour.
	function recolor() {
		if (!gl || !map || !theme || !styleReady) { return; }

		var p = palette(theme);
		var layers = (map.getStyle() || {}).layers || [];

		layers.forEach(function (layer) {
			var id = layer.id, name = id.toLowerCase(), type = layer.type;

			if (type === 'background') {
				paint(id, 'background-color', p.land);
			} else if (type === 'fill') {
				if (/water/.test(name)) { paint(id, 'fill-color', p.water); }
				else if (/building/.test(name)) { paint(id, 'fill-color', p.building); paint(id, 'fill-outline-color', p.buildingEdge); }
				else if (/park|green|wood|forest|grass|garden|golf|cemetery|pitch|recreation|scrub|meadow|farm/.test(name)) { paint(id, 'fill-color', p.park); }
				else if (/landcover|landuse|residential|hospital|school|university|industrial|commercial|aeroway|airport/.test(name)) { paint(id, 'fill-color', p.landAlt); }
			} else if (type === 'fill-extrusion') {
				paint(id, 'fill-extrusion-color', p.building);
			} else if (type === 'line') {
				if (/waterway|river|stream|canal|water/.test(name)) { paint(id, 'line-color', p.water); }
				else if (/boundary|admin|border/.test(name)) { paint(id, 'line-color', p.boundary); }
				else if (/rail|tram|subway|transit|funicular|cable/.test(name)) { paint(id, 'line-color', p.rail); }
				else if (/building/.test(name)) { paint(id, 'line-color', p.buildingEdge); }
				else if (/casing|outline|border/.test(name)) { paint(id, 'line-color', p.casing); }
				else if (/motorway|trunk|primary|secondary/.test(name)) { paint(id, 'line-color', p.roadMajor); }
				else if (/road|street|tertiary|minor|service|residential|link|path|track|pedestrian|bridge|tunnel|highway|aeroway/.test(name)) { paint(id, 'line-color', p.roadMinor); }
			} else if (type === 'symbol') {
				var muted = /housenumber|poi|rail|transit|station|road|street|path|waterway/.test(name);
				var onWater = /water|ocean|sea|lake|river/.test(name);

				paint(id, 'text-color', onWater ? p.waterLabel : (muted ? p.labelMuted : p.label));
				paint(id, 'text-halo-color', p.halo);
				paint(id, 'text-halo-width', 1.5);
				paint(id, 'text-halo-blur', 0.5);

				if (layer.layout && layer.layout['text-field']) { scaleText(id); }
			}
		});

		var css = document.documentElement.style;
		css.setProperty('--bg', theme.bg);
		css.setProperty('--surface', theme.surface);
		css.setProperty('--raised', theme.raised);
		css.setProperty('--outline', theme.outline);
		css.setProperty('--ink', theme.ink);
		css.setProperty('--ink-muted', theme.inkMuted);
		css.setProperty('--accent', theme.accent);
		css.setProperty('--accent-soft', theme.accentSoft);
		css.setProperty('--font', fontStack(theme.font));
		css.setProperty('--fs', String(theme.fontScale || 1));
	}

	function styleUrl(name) {
		return 'https://basemaps.cartocdn.com/gl/' + name + '-gl-style/style.json' +
			'?key=' + encodeURIComponent(key);
	}

	// ---- route lines (GeoJSON layers, re-added whenever the style is replaced) ----
	// Where our layers go: above every layer that is not a symbol (land, water, roads, buildings, extrusions,
	// hillshade: anything that is the ground), and below the first symbol layer after those, so labels stay readable.
	// With no symbol layer above the ground they go on top. Never "before the first label", which in some styles
	// lies underneath roads or buildings and let them cover the route.
	function firstLabelLayer() {
		var layers = (map.getStyle() || {}).layers || [];
		var ground = -1;

		for (var i = 0; i < layers.length; i++) {
			if (layers[i].type !== 'symbol' && layers[i].id.indexOf('dd-') !== 0) { ground = i; }
		}

		for (var j = ground + 1; j < layers.length; j++) {
			if (layers[j].type === 'symbol' && layers[j].id.indexOf('dd-') !== 0) { return layers[j].id; }
		}

		return undefined;
	}

	function drawLines() {
		if (!map) { return; }

		if (gl) { drawLinesGL(); } else { drawLinesLeaflet(); }
	}

	// Leaflet: the same lines as polylines (casing, line, dashed line) in their own layer group above the tiles.
	function drawLinesLeaflet() {
		lineGroup.clearLayers();

		var caseColor = theme && theme.dark ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.9)';
		var lines = scene.lines || [];

		function latlngs(line) { return line.points.map(function (pt) { return [pt[0], pt[1]]; }); }
		function opacity(line) { return line.opacity == null ? 1 : line.opacity; }

		lines.forEach(function (line) {
			if (line.dashed) { return; }

			L.polyline(latlngs(line), { color: caseColor, weight: (line.weight || 5) + 4, opacity: opacity(line), lineCap: 'round', lineJoin: 'round', interactive: false }).addTo(lineGroup);
		});

		lines.forEach(function (line) {
			var w = line.weight || 5;

			L.polyline(latlngs(line), { color: line.color, weight: w, opacity: opacity(line), lineCap: line.dashed ? 'butt' : 'round', lineJoin: 'round',
				dashArray: line.dashed ? (w * 1.2) + ' ' + (w * 1.6) : null, interactive: false }).addTo(lineGroup);
		});
	}

	function drawLinesGL() {
		if (!map || !styleReady) { return; }

		['dd-line-dash', 'dd-line', 'dd-casing'].forEach(function (id) {
			if (map.getLayer(id)) { map.removeLayer(id); }
		});

		if (map.getSource('dd-lines')) { map.removeSource('dd-lines'); }

		var features = (scene.lines || []).map(function (line) {
			return {
				type: 'Feature',
				properties: { color: line.color, weight: line.weight || 5, dashed: !!line.dashed, opacity: line.opacity == null ? 1 : line.opacity },
				geometry: { type: 'LineString', coordinates: line.points.map(function (pt) { return [pt[1], pt[0]]; }) }
			};
		});

		if (!features.length) { return; }

		map.addSource('dd-lines', { type: 'geojson', data: { type: 'FeatureCollection', features: features } });

		var before = firstLabelLayer();
		var caseColor = theme && theme.dark ? 'rgba(0,0,0,0.65)' : 'rgba(255,255,255,0.9)';
		var layout = { 'line-cap': 'round', 'line-join': 'round' };

		map.addLayer({ id: 'dd-casing', type: 'line', source: 'dd-lines', layout: layout,
			filter: ['!', ['get', 'dashed']],
			paint: { 'line-color': caseColor, 'line-width': ['+', ['get', 'weight'], 4], 'line-opacity': ['get', 'opacity'] } }, before);
		map.addLayer({ id: 'dd-line', type: 'line', source: 'dd-lines', layout: layout,
			filter: ['!', ['get', 'dashed']],
			paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'weight'], 'line-opacity': ['get', 'opacity'] } }, before);
		map.addLayer({ id: 'dd-line-dash', type: 'line', source: 'dd-lines', layout: { 'line-join': 'round' },
			filter: ['get', 'dashed'],
			paint: { 'line-color': ['get', 'color'], 'line-width': ['get', 'weight'], 'line-opacity': ['get', 'opacity'], 'line-dasharray': [1.2, 1.6] } }, before);
	}

	// ---- markers ----
	function esc(value) {
		return String(value == null ? '' : value).replace(/[&<>"]/g, function (c) {
			return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
		});
	}

	// A park &amp; ride site or a bike station (Tier 2): named from zoom 13, the counts from zoom 14; the CSS in
	// the header picks the short or the full form, so this only builds the two spans.
	function siteLabel(m) {
		return '<span class="dd-lbl dd-site"><span class="s">' + esc(m.label || '') + '</span><span class="f">' + esc(m.title || '') + '</span></span>';
	}

	function markerElement(m) {
		var el = document.createElement('div');
		var color = esc(m.color || '');
		var style = color ? ' style="border-color:' + color + '"' : '';
		var label = m.title ? '<span class="dd-lbl">' + esc(m.title) + '</span>' : '';
		var inner;

		el.className = 'dd-m';

		switch (m.kind) {
			case 'vehicle':
				var fill = m.color || (theme && theme.accent) || '#0b6e8a';
				inner = '<div class="dd-veh" style="background:' + esc(fill) + ';color:' + readableInk(fill) + '">' + esc(m.label) + '</div>';
				break;
			case 'parking':
				inner = '<i class="dd-parking"' + style + '>P</i>' + siteLabel(m);
				break;
			case 'bike':
				inner = '<i class="dd-bike"' + style + '><svg viewBox="0 0 24 24"><circle cx="6" cy="17" r="3.6"/><circle cx="18" cy="17" r="3.6"/><path d="M6.5 17l3.5-7h5l3 7M9.5 12h6"/></svg></i>' + label;
				break;
			case 'knot': inner = '<i class="dd-knot"></i>'; break;
			case 'start': inner = '<i class="dd-start" style="background:var(--accent)"></i>' + label; el.className += ' always'; break;
			case 'end': inner = '<i class="dd-end" style="background:var(--ink)"></i>' + label; el.className += ' always'; break;
			case 'current': inner = '<i class="dd-current"' + style + '></i>' + label; el.className += ' always'; break;
			case 'me': inner = '<i class="dd-me"></i>'; break;
			case 'poi': inner = '<i class="dd-poi"></i>' + label; break;
			default:
				inner = '<i class="dd-stop"' + style + '></i>' + label;

				if (color === '#9e9e9e') { el.className += ' prev'; }
		}

		el.innerHTML = inner;

		return el;
	}

	function popupHtml(m) {
		var title = m.title || (m.kind === 'vehicle' ? m.label : '');

		if (!title && !m.subtitle) { return null; }

		return '<div class="dd-pop"><b>' + esc(title) + '</b>' + (m.subtitle ? '<span>' + esc(m.subtitle) + '</span>' : '') + '</div>';
	}

	// One marker set per store (scene or overlay): add, update and remove by id.
	function syncMarkers(store, list, interactive) {
		if (!map) { return; }

		var seen = {};

		(list || []).forEach(function (m) {
			seen[m.id] = true;

			var entry = store[m.id];
			var signature = [m.kind, m.label, m.color, m.title, m.subtitle].join('|');
			var html = interactive ? null : popupHtml(m);

			if (entry && entry.signature === signature) {
				entry.marker.move(m.lat, m.lon);

				return;
			}

			if (entry) { entry.marker.remove(); }

			var el = markerElement(m);
			var z = m.kind === 'vehicle' ? 3 : (m.kind === 'knot' ? 0 : (m.kind === 'stop' ? 1 : 2));
			var marker = eng.marker(el, m, html, interactive, z);

			if (interactive) {
				// Overlay stops are chosen, not described: C# shows the actions.
				el.style.cursor = 'pointer';
				el.addEventListener('click', function (e) {
					e.stopPropagation();
					send('tap:' + m.id);
				});
			}

			el.style.zIndex = String(z);

			store[m.id] = { marker: marker, signature: signature };
		});

		Object.keys(store).forEach(function (id) {
			if (!seen[id]) {
				store[id].marker.remove();
				delete store[id];
			}
		});
	}

	function applyMarkers() {
		syncMarkers(markers, scene.markers, false);
		applyLayerMarkers();
	}

	// A move re-syncs only the markers of the layers (the in-view culling); shapes and labels are drawn when
	// a layer arrives or the style is rebuilt - never per pan, which would tear the zones down and up again.

	// ---- layers (per-id groups; static data arrives once, only what moves is sent again) ----
	function setLayer(id, payload) {
		if (!id) { return; }

		layerPayloads[id] = payload || {};

		if (!map) { return; }

		applyLayer(id);
	}

	function applyLayerMarkers() {
		Object.keys(layerPayloads).forEach(syncLayerMarkers);
	}

	function syncLayerMarkers(id) {
		if (!map) { return; }

		var payload = layerPayloads[id] || {};

		if (!layerStores[id]) { layerStores[id] = {}; }

		syncMarkers(layerStores[id], inView(payload.markers || []), true);
	}

	// A layer arrived: its markers and, only when it has (or had) any, its shapes.
	function applyLayer(id) {
		if (!map) { return; }

		syncLayerMarkers(id);

		var hasShapes = ((layerPayloads[id] || {}).polygons || []).length > 0;

		if (hasShapes || layerHadShapes[id]) {
			drawLayerShapes(id);
			layerHadShapes[id] = hasShapes;
		}
	}

	// A large layer (the sharing bikes are 500+) only keeps the markers in view, so the DOM never holds
	// them all at once; small layers (stops, parking, vehicles capped) go through unchanged. Called again
	// on every moveend, so what left the view goes and what entered arrives (the id-stable diff pays for it).
	var LAYER_CULL = 120;

	function inView(list) {
		if (!map || !list || list.length <= LAYER_CULL) { return list; }

		var bounds = map.getBounds();

		return list.filter(function (m) {
			return gl ? bounds.contains([m.lon, m.lat]) : bounds.contains([m.lat, m.lon]);
		});
	}

	function drawAllLayerShapes() {
		Object.keys(layerPayloads).forEach(function (id) {
			if (((layerPayloads[id] || {}).polygons || []).length > 0) { drawLayerShapes(id); }
		});
	}

	function drawLayerShapes(id) {
		if (!map) { return; }

		var polys = (layerPayloads[id] || {}).polygons || [];

		if (gl) { drawLayerShapesGL(id, polys); } else { drawLayerShapesLeaflet(id, polys); }
	}

	function drawLayerShapesGL(id, polys) {
		var fillId = 'dd-' + id + '-fill', lineId = 'dd-' + id + '-line';

		[fillId, lineId].forEach(function (lid) { if (map.getLayer(lid)) { map.removeLayer(lid); } });
		if (map.getSource('dd-' + id)) { map.removeSource('dd-' + id); }

		removeLayerLabels(id);

		if (!polys.length || !styleReady) { return; }

		var features = polys.map(function (poly) {
			var ring = poly.points.map(function (pt) { return [pt[1], pt[0]]; });

			// A GeoJSON ring is closed; the payload's ring may arrive open.
			if (ring.length && (ring[0][0] !== ring[ring.length - 1][0] || ring[0][1] !== ring[ring.length - 1][1])) { ring.push([ring[0][0], ring[0][1]]); }

			return {
				type: 'Feature',
				properties: { fill: poly.color, op: poly.opacity == null ? 0.12 : poly.opacity, outline: poly.outline || poly.color },
				geometry: { type: 'Polygon', coordinates: [ring] }
			};
		});

		map.addSource('dd-' + id, { type: 'geojson', data: { type: 'FeatureCollection', features: features } });

		// Under the route lines when there are any, and always under the first basemap label.
		var before = map.getLayer('dd-casing') ? 'dd-casing' : firstLabelLayer();

		map.addLayer({ id: fillId, type: 'fill', source: 'dd-' + id,
			paint: { 'fill-color': ['get', 'fill'], 'fill-opacity': ['get', 'op'] } }, before);
		map.addLayer({ id: lineId, type: 'line', source: 'dd-' + id, layout: { 'line-join': 'round' },
			paint: { 'line-color': ['get', 'outline'], 'line-width': 1, 'line-opacity': 0.55 } }, before);

		addLayerLabels(id, polys);
	}

	function drawLayerShapesLeaflet(id, polys) {
		if (!shapeGroup) { shapeGroup = L.layerGroup().addTo(map); }

		if (!layerPolyGroups[id]) { layerPolyGroups[id] = L.layerGroup().addTo(shapeGroup); }

		layerPolyGroups[id].clearLayers();
		removeLayerLabels(id);

		polys.forEach(function (poly) {
			var latlngs = poly.points.map(function (pt) { return [pt[0], pt[1]]; });

			L.polygon(latlngs, { color: poly.outline || poly.color, weight: 1, opacity: 0.55, fillColor: poly.color,
				fillOpacity: poly.opacity == null ? 0.12 : poly.opacity, interactive: false }).addTo(layerPolyGroups[id]);
		});

		addLayerLabels(id, polys);
	}

	// The number inside a zone (or whatever label a polygon carries): a plain element on top, zoom-gated by CSS.
	function addLayerLabels(id, polys) {
		layerLabelMarkers[id] = [];

		polys.forEach(function (poly) {
			if (!poly.label || !poly.at) { return; }

			var el = document.createElement('div');
			el.className = 'dd-zone-label';
			el.textContent = poly.label;

			var mk = gl
				? new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([poly.at[1], poly.at[0]]).addTo(map)
				: L.marker([poly.at[0], poly.at[1]], { icon: L.divIcon({ html: el, className: 'dd-zlicon', iconSize: [0, 0], iconAnchor: [0, 0] }), interactive: false, keyboard: false }).addTo(map);

			layerLabelMarkers[id].push(mk);
		});
	}

	function removeLayerLabels(id) {
		(layerLabelMarkers[id] || []).forEach(function (mk) { mk.remove(); });

		layerLabelMarkers[id] = [];
	}

	// The visible area, reported after every move so C# can load what is in it.
	function reportView() {
		if (!map) { return; }

		var b = map.getBounds();
		var c = map.getCenter();

		send('view:' + JSON.stringify({ s: b.getSouth(), w: b.getWest(), n: b.getNorth(), e: b.getEast(), z: map.getZoom(), lat: c.lat, lon: c.lng }));
	}

	function fit() {
		if (!map) { return; }

		var points = [];

		(scene.lines || []).forEach(function (line) { line.points.forEach(function (pt) { points.push([pt[0], pt[1]]); }); });
		(scene.markers || []).forEach(function (m) { points.push([m.lat, m.lon]); });

		if (!points.length) { return; }

		programmatic++;

		try { eng.fit(points); } finally { programmatic--; }
	}

	function updateLabelZoom() {
		document.body.classList.toggle('zl', map.getZoom() >= 14.2);
		document.body.classList.toggle('zz', map.getZoom() >= 13);
	}

	// A minimal MapLibre control built from a class name and a function that fills its box.
	function control(className, build) {
		var box = null;

		return {
			onAdd: function () { box = document.createElement('div'); box.className = className; build(box); return box; },
			onRemove: function () { if (box && box.parentNode) { box.parentNode.removeChild(box); } box = null; }
		};
	}

	// The three controls of the page, filled the same way for either engine.
	function buildFitNow(box) {
		var b = document.createElement('button');
		b.type = 'button';
		b.title = labels.fitNow;
		b.setAttribute('aria-label', labels.fitNow);
		b.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
		b.addEventListener('click', function () { fit(); });
		box.appendChild(b);
	}

	function buildAuto(box) {
		autoButton = document.createElement('button');
		autoButton.type = 'button';
		autoButton.innerHTML = '<i></i><span></span>';
		autoButton.addEventListener('click', function () {
			setAuto(!autoFit);
			send('auto:' + autoFit);
			if (autoFit) { fit(); }
		});
		box.appendChild(autoButton);
		refreshAuto();
	}

	// The layers button (top right, beside zoom and fit): opens the app-provided rows. Checkbox rows
	// toggle their layer; plain link rows only announce their tap (C# decides what happens then).
	function buildLayers(box) {
		layerPanel = document.createElement('div');
		layerButton = document.createElement('button');
		layerButton.type = 'button';
		layerButton.innerHTML = '<svg viewBox="0 0 24 24"><path class="solid" d="M12 3l9 5-9 5-9-5 9-5z"/><path d="M3 13l9 5 9-5"/></svg>';
		layerButton.style.display = 'none';
		layerButton.setAttribute('aria-haspopup', 'true');
		layerButton.setAttribute('aria-expanded', 'false');

		function setOpen(open) {
			box.classList.toggle('open', open);
			layerButton.setAttribute('aria-expanded', open ? 'true' : 'false');
		}

		layerButton.addEventListener('click', function (e) { e.stopPropagation(); setOpen(!box.classList.contains('open')); });
		document.addEventListener('click', function () { setOpen(false); });
		document.addEventListener('keydown', function (e) {
			if (e.key === 'Escape' && box.classList.contains('open')) { setOpen(false); layerButton.focus(); }
		});
		map.on('movestart', function () { setOpen(false); });
		layerPanel.addEventListener('click', function (e) { e.stopPropagation(); });
		box.appendChild(layerPanel);
		box.appendChild(layerButton);
		refreshLayerRows();
	}

	function refreshLayerRows() {
		if (!layerButton || !layerPanel) { return; }

		var rows = layerRows || [];

		layerButton.style.display = rows.length ? 'flex' : 'none';
		layerButton.title = layerTitle;
		layerButton.setAttribute('aria-label', layerTitle);
		layerPanel.innerHTML = '';

		var sawLink = false;

		rows.forEach(function (row) {
			var b = document.createElement('button');
			var check = !row.link;
			var label = document.createElement('span');

			// The switches first, then a rule, then the places a row only leads to.
			if (!check && !sawLink && layerPanel.children.length) {
				var rule = document.createElement('div');
				rule.className = 'rule';
				layerPanel.appendChild(rule);
			}

			sawLink = sawLink || !check;

			b.type = 'button';
			b.className = 'row' + (check && layerState[row.id] ? ' on' : '') + (check ? '' : ' link');
			label.textContent = row.label;

			if (check) {
				b.setAttribute('role', 'checkbox');
				b.setAttribute('aria-checked', layerState[row.id] ? 'true' : 'false');
				b.appendChild(document.createElement('i'));
			}

			b.appendChild(label);
			b.addEventListener('click', function (e) {
				e.stopPropagation();

				if (check) {
					layerState[row.id] = !layerState[row.id];
					b.classList.toggle('on', !!layerState[row.id]);
					b.setAttribute('aria-checked', layerState[row.id] ? 'true' : 'false');
				}

				postLayers(check ? null : row.id);
			});

			layerPanel.appendChild(b);
		});
	}

	// Every change posts all rows, so C# stays stateless; a plain row posts its own id as well.
	function postLayers(linkId) {
		var state = {};

		Object.keys(layerState).forEach(function (rowId) { state[rowId] = layerState[rowId]; });

		if (linkId) { state[linkId] = true; }

		send('layers:' + JSON.stringify(state));
	}

	function buildAttribution(box, html) {
		var b = document.createElement('button');
		b.type = 'button';
		b.textContent = 'i';
		b.title = labels.info;
		b.setAttribute('aria-label', labels.info);
		var d = document.createElement('div');
		d.innerHTML = html;
		b.addEventListener('click', function (e) { e.stopPropagation(); box.classList.toggle('open'); });
		box.appendChild(d);
		box.appendChild(b);
		map.on('movestart', function () { box.classList.remove('open'); });
		document.addEventListener('click', function () { box.classList.remove('open'); });
	}

	var ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a> &middot; P+R: VVO &middot; Bikes: Nextbike &middot; ';

	function refreshAuto() {
		if (!autoButton) { return; }

		autoButton.className = autoFit ? 'on' : '';
		autoButton.setAttribute('aria-pressed', autoFit ? 'true' : 'false');
		autoButton.lastChild.textContent = labels.autoFit;
	}

	function setAuto(on) {
		autoFit = !!on;
		refreshAuto();
	}

	// ---- map lifecycle ----
	function createMap() {
		if (gl) { createGLMap(); } else { createLeafletMap(); }

		updateLabelZoom();
	}

	function createGLMap() {
		styleName = theme.dark ? 'dark-matter' : 'voyager';

		dd('createMap: style ' + styleName + ', key ' + (key ? 'set (' + key.length + ' chars)' : 'missing') + ', container ' + document.getElementById('map').clientWidth + 'x' + document.getElementById('map').clientHeight);

		try {
			map = new maplibregl.Map({
			container: 'map',
			style: styleUrl(styleName),
			center: [13.7373, 51.0504],
			zoom: 12,
			maxZoom: 19,
			attributionControl: false,
			dragRotate: false,
			pitchWithRotate: false,
			touchPitch: false,
			transformRequest: function (url) {
				// The key belongs on every CARTO request (style, tiles, glyphs, sprites).
				if (key && /(^|\.)basemaps\.cartocdn\.com\//.test(url.replace(/^https?:\/\//, '')) && url.indexOf('key=') < 0) {
					return { url: url + (url.indexOf('?') < 0 ? '?' : '&') + 'key=' + encodeURIComponent(key) };
				}

				return { url: url };
			}
		});
		} catch (e) {
			dd('new maplibregl.Map threw: ' + (e && e.stack ? e.stack : e));
			send('error:map constructor: ' + (e && e.message));
			map = null;
			throw e;
		}

		dd('createMap: map object created');

		map.touchZoomRotate.disableRotation();
		map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
		map.addControl(control('maplibregl-ctrl maplibregl-ctrl-group dd-fitnow', buildFitNow), 'top-right');
		map.addControl(control('maplibregl-ctrl maplibregl-ctrl-group dd-layers', buildLayers), 'top-right');

		// Lower left: the top of the map is covered by the page's hints (tracking banner and the like).
		map.addControl(control('maplibregl-ctrl dd-fit', buildAuto), 'bottom-left');
		map.addControl(control('maplibregl-ctrl dd-attr', function (box) { buildAttribution(box, ATTRIBUTION + '<a href="https://maplibre.org">MapLibre</a>'); }), 'bottom-right');

		// Moving the map by hand ends automatic fitting (a fixed view is what the person asked for by moving it).
		['dragstart', 'zoomstart'].forEach(function (name) {
			map.on(name, function (e) {
				if (e && e.originalEvent && autoFit) { setAuto(false); }
			});
		});

		map.on('zoom', updateLabelZoom);

		map.on('moveend', function () {
			clearTimeout(viewTimer);
			viewTimer = setTimeout(reportView, 300);
			applyLayerMarkers();
		});

		map.on('click', function (e) {
			if (pickMode) { send('point:' + e.lngLat.lat + ',' + e.lngLat.lng); }
		});

		map.on('style.load', function () {
			styleReady = true;
			baseSizes = {};

			recolor();
			drawLines();
			drawAllLayerShapes();

			if (wantFit) { wantFit = false; fit(); }

			reportView();
		});

		map.on('error', function (e) {
			var status = e && e.error && e.error.status;

			dd('map error: ' + ((e && e.error && e.error.message) || 'unknown') + (status ? ' (status ' + status + ')' : '') + (e && e.sourceId ? ' source ' + e.sourceId : '')
				+ (e && e.error && e.error.url ? ' url ' + e.error.url : '') + (e && e.error && e.error.stack ? '\n' + e.error.stack : ''));

			// CARTO does not accept the key: the page cannot draw a basemap, C# says so.
			if (status === 401 || status === 403) { send('keyrejected'); }

			if (errors++ < 15) { send('error:' + ((e && e.error && e.error.message) || 'map error')); }
		});

		watchMap();
	}

	// ---- Leaflet: raster tiles, no WebGL; the same markers, lines, controls and messages ----
	// Raster tile sources in the order they are tried. OpenStreetMap's own server first (no key, the usual choice of
	// Leaflet apps; its tiles are light only, so dark mode inverts them by CSS); CARTO's raster tiles second (they need
	// the CARTO key now, if one is set). A source that delivers no tile at all is dropped for the next one.
	var tileSources = [
		{ id: 'osm', maxZoom: 19, retina: false, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
			url: function () { return 'https://tile.openstreetmap.org/{z}/{x}/{y}.png'; } },
		{ id: 'carto', maxZoom: 19, retina: true, subdomains: 'abcd', native: true, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
			url: function (dark) { return 'https://{s}.basemaps.cartocdn.com/' + (dark ? 'dark_all' : 'rastertiles/voyager') + '/{z}/{x}/{y}{r}.png' + (key ? '?key=' + encodeURIComponent(key) : ''); } }
	];
	var tileIndex = 0, tilesOk = 0, tilesFailed = 0, attrDiv = null;

	function applyTileLook() {
		// Dark mode with a light-only source: invert the picture (and turn the hues back) instead of showing a white map.
		var invert = !!(theme && theme.dark) && !tileSources[tileIndex].native;

		map.getPanes().tilePane.style.filter = invert ? 'invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.9)' : '';

		if (attrDiv) { attrDiv.innerHTML = tileSources[tileIndex].attribution + ' &middot; <a href="https://leafletjs.com">Leaflet</a> &middot; P+R: VVO &middot; Bikes: Nextbike'; }
	}

	function makeTiles() {
		var src = tileSources[tileIndex];

		if (tiles) { map.removeLayer(tiles); }

		tilesOk = 0;
		tilesFailed = 0;

		var layer = L.tileLayer(src.url(!!(theme && theme.dark)), { subdomains: src.subdomains || 'abc', maxZoom: src.maxZoom, detectRetina: src.retina });

		tiles = layer;
		dd('tiles: source ' + src.id + ' ' + src.url(!!(theme && theme.dark)).replace(/key=[^&]*/, 'key=***'));

		layer.on('tileload', function () {
			if (tiles !== layer) { return; }

			if (tilesOk++ === 0) { dd('tiles: first tile of ' + src.id + ' loaded'); }
		});

		layer.on('tileerror', function (e) {
			if (tiles !== layer) { return; }

			tilesFailed++;

			if (tilesFailed <= 3) { dd('tiles: ' + src.id + ' failed: ' + (e && e.tile ? e.tile.src.replace(/key=[^&]*/, 'key=***') : '?')); }

			if (tilesOk === 0 && tilesFailed >= 4) {
				if (tileIndex < tileSources.length - 1) {
					tileIndex++;
					dd('tiles: ' + src.id + ' delivers nothing, switching to ' + tileSources[tileIndex].id);
					makeTiles();
				} else if (tilesFailed === 4) {
					send('error:no tile source answered');
				}
			}
		});

		tiles.addTo(map);
		applyTileLook();
	}

	function lfControl(position, className, build) {
		var Custom = L.Control.extend({
			options: { position: position },
			onAdd: function () {
				var box = L.DomUtil.create('div', className);
				build(box);
				L.DomEvent.disableClickPropagation(box);

				return box;
			}
		});

		new Custom().addTo(map);
	}

	function createLeafletMap() {
		dd('createLeafletMap: container ' + document.getElementById('map').clientWidth + 'x' + document.getElementById('map').clientHeight);

		map = L.map('map', { center: [51.0504, 13.7373], zoom: 12, maxZoom: 19, zoomControl: false, attributionControl: false, zoomAnimation: true, fadeAnimation: true });

		makeTiles();

		// Polygons of the layers lie under the route lines: their group is added first.
		shapeGroup = L.layerGroup().addTo(map);
		lineGroup = L.layerGroup().addTo(map);
		styleName = theme.dark ? 'dark' : 'light';
		styleReady = true;

		L.control.zoom({ position: 'topright' }).addTo(map);
		lfControl('topright', 'leaflet-bar dd-fitnow', buildFitNow);
		lfControl('topright', 'leaflet-bar dd-layers', buildLayers);
		lfControl('bottomleft', 'dd-fit', buildAuto);
		lfControl('bottomright', 'dd-attr', function (box) { buildAttribution(box, ''); attrDiv = box.firstChild; applyTileLook(); });

		// Our own moves (fit, jump, ease) must not switch Auto-fit off; a drag or a zoom by the person does.
		map.on('dragstart', function () { if (autoFit) { setAuto(false); } });
		map.on('zoomstart', function () { if (!programmatic && autoFit) { setAuto(false); } });
		map.on('zoom', updateLabelZoom);

		map.on('moveend', function () {
			clearTimeout(viewTimer);
			viewTimer = setTimeout(reportView, 300);
			applyLayerMarkers();
		});

		map.on('click', function (e) {
			if (pickMode) { send('point:' + e.latlng.lat + ',' + e.latlng.lng); }
		});

		drawLines();

		if (wantFit) { wantFit = false; fit(); }

		// The container may not have had its final size yet: measure again once the page has settled.
		[0, 300, 1200].forEach(function (ms) { setTimeout(function () { if (map) { map.invalidateSize(); } }, ms); });
		window.addEventListener('orientationchange', function () { setTimeout(function () { map.invalidateSize(); }, 300); });

		reportView();
	}

	// What differs between the engines, behind one small interface (positions are always lat, lon).
	var engines = {
		carto: {
			marker: function (el, m, html, interactive) {
				var mk = new maplibregl.Marker({ element: el, anchor: 'center' }).setLngLat([m.lon, m.lat]);

				if (html) { mk.setPopup(new maplibregl.Popup({ offset: 16, closeButton: false, maxWidth: '260px' }).setHTML(html)); }

				mk.addTo(map);

				return {
					move: function (lat, lon) { mk.setLngLat([lon, lat]); },
					remove: function () { mk.remove(); },
					position: function () { var p = mk.getLngLat(); return [p.lat, p.lng]; },
					showPopup: function () { var p = mk.getPopup(); if (p && !p.isOpen()) { mk.togglePopup(); } }
				};
			},
			jump: function (lat, lon, zoom) { map.jumpTo({ center: [lon, lat], zoom: zoom }); },
			ease: function (lat, lon, zoom, ms) { map.easeTo({ center: [lon, lat], zoom: zoom, duration: ms }); },
			fit: function (points) {
				var b = new maplibregl.LngLatBounds();

				points.forEach(function (pt) { b.extend([pt[1], pt[0]]); });

				if (b.getSouthWest().lat === b.getNorthEast().lat && b.getSouthWest().lng === b.getNorthEast().lng) {
					map.jumpTo({ center: b.getCenter(), zoom: 16 });
				} else {
					map.fitBounds(b, { padding: 48, maxZoom: 17, duration: 0 });
				}
			},
			theme: function (t) {
				var name = t.dark ? 'dark-matter' : 'voyager';

				if (name !== styleName) {
					styleName = name;
					styleReady = false;
					map.setStyle(styleUrl(name));
				} else {
					recolor();
					drawLines();
				}
			}
		},

		leaflet: {
			marker: function (el, m, html, interactive, z) {
				var icon = L.divIcon({ html: el, className: 'dd-licon', iconSize: [0, 0], iconAnchor: [0, 0], popupAnchor: [0, -12] });
				var mk = L.marker([m.lat, m.lon], { icon: icon, interactive: !!(html || interactive), keyboard: false, zIndexOffset: z * 1000 });

				if (html) { mk.bindPopup(html, { closeButton: false, maxWidth: 260, className: 'dd-popup' }); }

				mk.addTo(map);

				return {
					move: function (lat, lon) { mk.setLatLng([lat, lon]); },
					remove: function () { mk.remove(); },
					position: function () { var p = mk.getLatLng(); return [p.lat, p.lng]; },
					showPopup: function () { if (mk.getPopup() && !mk.isPopupOpen()) { mk.openPopup(); } }
				};
			},
			jump: function (lat, lon, zoom) { programmatic++; try { map.setView([lat, lon], zoom, { animate: false }); } finally { programmatic--; } },
			ease: function (lat, lon, zoom, ms) { programmatic++; try { map.setView([lat, lon], zoom, { animate: true, duration: ms / 1000 }); } finally { programmatic--; } },
			fit: function (points) {
				var b = L.latLngBounds(points);

				if (b.getSouthWest().equals(b.getNorthEast())) {
					map.setView(b.getCenter(), 16, { animate: false });
				} else {
					map.fitBounds(b, { padding: [48, 48], maxZoom: 17, animate: false });
				}
			},
			theme: function (t) {
				var name = t.dark ? 'dark' : 'light';

				if (name !== styleName) {
					styleName = name;
					tiles.setUrl(tileSources[tileIndex].url(!!t.dark));
				}

				applyTileLook();
				drawLines();
			}
		}
	};

	eng = engines[engine];

	// What the map reports about itself, for the log: first style, first frame, idle, failures with their details.
	function watchMap() {
		var canvas = map.getCanvas();

		canvas.addEventListener('webglcontextlost', function (e) { dd('map canvas: webgl context lost (default prevented: ' + e.defaultPrevented + ')'); });
		canvas.addEventListener('webglcontextrestored', function () { dd('map canvas: webgl context restored'); });

		map.on('styledata', function () { if (!firstStyle) { firstStyle = true; dd('map: first styledata'); } });
		map.on('render', function () { if (!firstRender) { firstRender = true; dd('map: first frame rendered'); } });
		map.on('idle', function () { if (!firstIdle) { firstIdle = true; dd('map: idle (everything visible is loaded)'); } });
		map.on('load', function () { dd('map: load'); });
		map.on('sourcedata', function (e) { if (e && e.sourceDataType === 'metadata' && e.isSourceLoaded) { dd('map: source ready ' + e.sourceId); } });
	}

	function setTheme(t) {
		theme = t;
		document.body.classList.toggle('dark', !!t.dark);

		var css = document.documentElement.style;
		css.setProperty('--bg', t.bg);
		css.setProperty('--surface', t.surface);
		css.setProperty('--raised', t.raised);
		css.setProperty('--outline', t.outline);
		css.setProperty('--ink', t.ink);
		css.setProperty('--ink-muted', t.inkMuted);
		css.setProperty('--accent', t.accent);
		css.setProperty('--accent-soft', t.accentSoft);
		css.setProperty('--on-accent', readableInk(t.accent));
		css.setProperty('--font', fontStack(t.font));
		css.setProperty('--fs', String(t.fontScale || 1));

		if (!map) { return; }

		eng.theme(t);
	}

	// The one entry point C# calls (HybridWebView.InvokeJavaScriptAsync).
	// The one entry point C# calls (HybridWebView.InvokeJavaScriptAsync). The layer command carries a
	// layer id between the command and the json; every other command passes (command, json) only.
	window.ddMapCall = function (command, a, b) {
		var id = b === undefined ? null : a;
		var json = b === undefined ? a : b;

		dd('ddMapCall ' + command + (id ? ' ' + id : '') + (json ? ' (' + json.length + ' chars)' : ''));

		try {
			return mapCall(command, json, id);
		} catch (e) {
			dd('ddMapCall ' + command + ' threw: ' + (e && e.stack ? e.stack : e));
			send('error:' + command + ': ' + (e && e.message));
			throw e;
		}
	};

	function mapCall(command, json, id) {
		var arg = json ? JSON.parse(json) : null;

		switch (command) {
			case 'init':
				key = arg.key || '';
				theme = arg.theme;
				if (arg.labels) { labels = arg.labels; }
				autoFit = arg.autoFit !== false;
				document.body.classList.toggle('dark', !!theme.dark);
				if (!map) { createMap(); setTheme(theme); applyMarkers(); }
				break;

			case 'mode':
				explore = !!arg.explore;
				pickMode = !!arg.pick;
				if (explore || pickMode) { setAuto(false); }
				if (arg.center && map) { eng.jump(arg.center.lat, arg.center.lon, arg.center.zoom || 15); }
				reportView();
				break;

			case 'layer':
				setLayer(id, arg);
				break;

			case 'layers':
				layerRows = (arg && arg.rows) || [];
				layerState = (arg && arg.state) || {};
				layerTitle = (arg && arg.label) || '';
				refreshLayerRows();
				break;

			case 'center':
				if (map) {
					eng.ease(arg.lat, arg.lon, arg.zoom || Math.max(map.getZoom(), 15), 400);
				} else {
					pendingCenter = arg;
				}
				break;

			case 'theme':
				setTheme(arg);
				break;

			case 'key':
				key = arg.key || '';
				errors = 0;
				if (map && gl) { styleReady = false; map.setStyle(styleUrl(styleName)); }
				if (map && !gl && tileSources[tileIndex].id === 'carto') { tiles.setUrl(tileSources[tileIndex].url(!!(theme && theme.dark))); }
				break;

			case 'set':
				scene = arg;
				applyMarkers();

				// A scene that asks for it (first showing) is fitted; with Auto-fit on, every update is.
				var doFit = !!scene.fit || autoFit;

				if (styleReady) { drawLines(); if (doFit) { fit(); } } else { wantFit = doFit; }
				break;

			case 'focus':
				var entry = markers[arg];

				if (entry && map) {
					var at = entry.marker.position();

					eng.ease(at[0], at[1], Math.max(map.getZoom(), 16), 350);
					entry.marker.showPopup();
				}
				break;
		}
	}

	dd('page script ready: maplibregl=' + typeof window.maplibregl + ', hybridwebview=' + typeof window.HybridWebView);
	if (window.ddFlush) { window.ddFlush(); }
	send('ready');
};
</script>
