<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DDjourneys notice</title>
<link rel="icon" href="data:,">
<script src="_framework/hybridwebview.js"></script>
<style>
:root {
	--bg: #f2f4f5; --surface: #ffffff; --raised: #dfe6e9; --outline: #b4c1c7;
	--ink: #0f1a1f; --ink-muted: #4a5960; --accent: #0b6e8a; --accent-soft: #d3e9f0;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.5 "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 4px 16px 32px; overflow-wrap: anywhere; -webkit-text-size-adjust: 100%; }
#content > :first-child { margin-top: 8px; }
p, ul, ol, table, blockquote, pre { margin: 0 0 12px; }
ul, ol { padding-left: 22px; }
li { margin: 2px 0; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 18px 0 8px; font-weight: 700; }
h1 { font-size: 1.35em; } h2 { font-size: 1.25em; } h3 { font-size: 1.15em; } h4, h5, h6 { font-size: 1.05em; }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
hr { border: 0; border-top: 1px solid var(--outline); margin: 16px 0; }
blockquote { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; color: var(--ink-muted); }
pre, code { font-family: ui-monospace, Consolas, monospace; font-size: 0.92em; background: var(--raised); border-radius: 4px; }
pre { padding: 8px 10px; overflow-x: auto; } code { padding: 1px 4px; }
table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
th, td { border: 1px solid var(--outline); padding: 6px 8px; text-align: left; vertical-align: top; }
th { background: var(--raised); }
img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--outline); display: block; margin: 8px 0; cursor: zoom-in; background: var(--surface); }
a > img { cursor: pointer; }
.badge { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); font-size: 0.72em; font-weight: 700; letter-spacing: .03em; text-decoration: none; vertical-align: 1px; }
.empty { color: var(--ink-muted); }

/* Image viewer: fills the page, tap the picture to zoom, tap outside or the button to close. */
#lb { position: fixed; inset: 0; background: rgba(0,0,0,.88); display: none; z-index: 10; }
#lb.open { display: block; }
#lbScroll { position: absolute; inset: 0; overflow: auto; display: flex; -webkit-overflow-scrolling: touch; }
#lbImg { margin: auto; max-width: 100vw; max-height: 100vh; width: auto; height: auto; border: 0; border-radius: 0; background: none; cursor: zoom-in; }
#lb.zoom #lbImg { max-width: none; max-height: none; width: 220vw; cursor: zoom-out; }
#lbClose { position: absolute; top: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--outline); background: var(--surface); color: var(--ink);
	font-size: 22px; line-height: 1; cursor: pointer; z-index: 11; }
#lbMsg { position: absolute; left: 0; right: 0; bottom: 24px; text-align: center; color: #fff; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<div id="content"></div>
<div id="lb" role="dialog" aria-modal="true">
	<div id="lbScroll"><img id="lbImg" alt=""></div>
	<button id="lbClose" type="button" aria-label="Close">&times;</button>
	<div id="lbMsg"></div>
</div>
<script>
(function () {
	'use strict';

	var labels = { close: 'Close', imageFailed: 'The image could not be loaded.' };
	var BASE = 'https://www.vvo-online.de/';

	function send(text) { try { window.HybridWebView.SendRawMessage(text); } catch (e) { } }
	window.addEventListener('error', function (e) { send('error:' + e.message); });

	// ---- theme ----
	function applyTheme(t) {
		var css = document.documentElement.style;
		css.setProperty('--bg', t.bg);
		css.setProperty('--surface', t.surface);
		css.setProperty('--raised', t.raised);
		css.setProperty('--outline', t.outline);
		css.setProperty('--ink', t.ink);
		css.setProperty('--ink-muted', t.inkMuted);
		css.setProperty('--accent', t.accent);
		css.setProperty('--accent-soft', t.accentSoft);
		document.documentElement.style.colorScheme = t.dark ? 'dark' : 'light';
	}

	// ---- sanitiser: only what a notice needs is rebuilt; every other tag is unwrapped or dropped, no attribute survives
	// except the few listed, and URLs must be http(s)/mailto/tel. Nothing from the notice is ever executed. ----
	var KEEP = 'A B STRONG I EM U S STRIKE DEL INS BR P DIV SPAN UL OL LI H1 H2 H3 H4 H5 H6 TABLE THEAD TBODY TFOOT TR TD TH HR IMG SMALL SUB SUP BLOCKQUOTE PRE CODE'.split(' ');
	var DROP = 'SCRIPT STYLE IFRAME OBJECT EMBED FORM INPUT BUTTON SELECT TEXTAREA LINK META BASE SVG MATH TEMPLATE NOSCRIPT'.split(' ');
	var TOPLINE = { FONT: 'SPAN', CENTER: 'DIV', B: 'B' };

	function safeUrl(value, allowed) {
		try {
			var u = new URL(String(value || '').trim(), BASE);
			return allowed.indexOf(u.protocol) >= 0 ? u.href : null;
		} catch (e) { return null; }
	}

	function clean(from, into) {
		for (var n = from.firstChild; n; n = n.nextSibling) {
			if (n.nodeType === 3) { into.appendChild(document.createTextNode(n.nodeValue)); continue; }
			if (n.nodeType !== 1) { continue; }

			var tag = n.tagName.toUpperCase();

			if (DROP.indexOf(tag) >= 0) { continue; }
			if (TOPLINE[tag] && KEEP.indexOf(tag) < 0) { tag = TOPLINE[tag]; }

			if (KEEP.indexOf(tag) < 0) { clean(n, into); continue; }

			var el = document.createElement(tag);

			if (tag === 'A') {
				var href = safeUrl(n.getAttribute('href'), ['http:', 'https:', 'mailto:', 'tel:']);
				if (href) { el.setAttribute('href', href); }
			} else if (tag === 'IMG') {
				var src = safeUrl(n.getAttribute('src'), ['http:', 'https:']);
				if (!src) { continue; }
				el.setAttribute('src', src);
				el.setAttribute('loading', 'lazy');
				el.setAttribute('alt', (n.getAttribute('alt') || '').slice(0, 300));
			} else if (tag === 'TD' || tag === 'TH') {
				['colspan', 'rowspan'].forEach(function (a) {
					var v = parseInt(n.getAttribute(a), 10);
					if (v > 0 && v < 50) { el.setAttribute(a, String(v)); }
				});
			}

			if (tag !== 'IMG' && tag !== 'BR' && tag !== 'HR') { clean(n, el); }

			into.appendChild(el);
		}
	}

	function kindOf(href) {
		var path = href.split('#')[0].split('?')[0].toLowerCase();
		if (/\.pdf$/.test(path)) { return 'PDF'; }
		if (/\.(png|jpe?g|gif|webp|bmp|svg)$/.test(path)) { return 'IMG'; }
		return '';
	}

	function render(html) {
		var host = document.getElementById('content');
		host.textContent = '';

		var doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
		var out = document.createElement('div');
		clean(doc.body, out);

		// Links to a PDF or a picture are marked, so it is clear before the tap that the app opens them itself.
		Array.prototype.forEach.call(out.querySelectorAll('a[href]'), function (a) {
			var kind = kindOf(a.getAttribute('href'));
			if (kind && !a.querySelector('img')) {
				var badge = document.createElement('span');
				badge.className = 'badge';
				badge.textContent = kind === 'PDF' ? 'PDF' : 'IMG';
				a.appendChild(badge);
			}
		});

		if (!out.textContent.trim() && !out.querySelector('img')) {
			var p = document.createElement('p');
			p.className = 'empty';
			p.textContent = labels.empty || '';
			out.appendChild(p);
		}

		while (out.firstChild) { host.appendChild(out.firstChild); }
	}

	// ---- links and pictures ----
	document.addEventListener('click', function (e) {
		var t = e.target;
		if (!t || !t.closest) { return; }

		if (t.closest('#lb')) { return; }

		var a = t.closest('a[href]');
		var img = t.closest('#content img');

		if (a) {
			e.preventDefault();
			send('link:' + a.getAttribute('href'));
		} else if (img) {
			e.preventDefault();
			openImage(img.getAttribute('src'));
		}
	}, true);

	var lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbMsg = document.getElementById('lbMsg');

	function openImage(url) {
		lb.classList.remove('zoom');
		lbMsg.textContent = '';
		lbImg.onerror = function () { lbMsg.textContent = labels.imageFailed; };
		lbImg.src = url;
		lb.classList.add('open');
	}

	function closeImage() { lb.classList.remove('open', 'zoom'); lbImg.removeAttribute('src'); }

	document.getElementById('lbClose').addEventListener('click', closeImage);
	lbImg.addEventListener('click', function (e) { e.stopPropagation(); lb.classList.toggle('zoom'); });
	document.getElementById('lbScroll').addEventListener('click', function (e) { if (e.target === this) { closeImage(); } });
	document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeImage(); } });

	// The one entry point C# calls (HybridWebView.InvokeJavaScriptAsync).
	window.ddNoticeCall = function (command, json) {
		var arg = json ? JSON.parse(json) : null;

		switch (command) {
			case 'init':
				if (arg.labels) { labels = arg.labels; document.getElementById('lbClose').setAttribute('aria-label', labels.close || 'Close'); }
				applyTheme(arg.theme);
				render(arg.html);
				break;
			case 'theme': applyTheme(arg); break;
			case 'html': render(arg.html); break;
			case 'image': openImage(arg.url); break;
		}
	};

	send('ready');
})();
</script>
</body>
</html>
