<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="456" height="456" viewBox="0 0 456 456">
  <!-- Adaptive icon background: art-free on purpose. The foreground file carries the route and the tram. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD85A"/>
      <stop offset="1" stop-color="#E6A91D"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#25323B"/>
      <stop offset="1" stop-color="#121A20"/>
    </linearGradient>
  </defs>
  <rect width="456" height="456" fill="url(#gold)"/>
  <circle cx="228" cy="228" r="128" fill="url(#night)"/>
</svg>
