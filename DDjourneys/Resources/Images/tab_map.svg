<?xml version="1.0" encoding="utf-8"?>
<!-- The phone's map tab icon: the app's own geometry (Controls/IconGlyph.cs, tab_map), drawn on the
     24x24 grid with the 2-unit round stroke of the icon family, in plain black so the tab bar's
     icon tint can recolour it (the bar follows the app's appearance; see AppShell.xaml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<path fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3.5 6.2 L9 4 L15 6.2 L20.5 4 V17.8 L15 20 L9 17.8 L3.5 20 Z M9 4 V17.8 M15 6.2 V20" />
</svg>
