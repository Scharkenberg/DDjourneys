<?xml version="1.0" encoding="utf-8"?>
<!-- The phone's more tab icon: the app's own geometry (Controls/IconGlyph.cs, tab_more), drawn on the
     24x24 grid with the 2-unit round stroke of the icon family, in plain black so the tab bar's
     icon tint can recolour it (the bar follows the app's appearance; see AppShell.xaml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<path fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4.8 12 V12.1 M12 12 V12.1 M19.2 12 V12.1" />
</svg>
