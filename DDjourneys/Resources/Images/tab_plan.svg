<?xml version="1.0" encoding="utf-8"?>
<!-- The phone's planner tab icon: the app's own geometry (Controls/IconGlyph.cs, tab_plan), drawn on the
     24x24 grid with the 2-unit round stroke of the icon family, in plain black so the tab bar's
     icon tint can recolour it (the bar follows the app's appearance; see AppShell.xaml). -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
	<path fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M5.5 18.6 C6.5 13.5 11 14.6 11 10 C11 6.4 14 5.4 18.6 5.4 M5.5 18.6 V18.7 M18.6 5.4 V5.5" />
</svg>
