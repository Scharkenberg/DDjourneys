-keep class com.google.android.material.slider.** { *; }

# Classes that only the merged AndroidManifest.xml names (nothing in code refers to them), so R8 cannot see that they
# are used: App Startup's provider and every initializer it runs (androidx.window, lifecycle, emoji2, profileinstaller).
-keep class androidx.startup.InitializationProvider { *; }
-keep class * extends androidx.startup.Initializer { *; }
-keep class androidx.startup.** { *; }

# Components of the app and of its libraries that the manifest instantiates by name.
-keep class * extends android.content.ContentProvider
-keep class * extends android.app.Application
-keep class * extends android.content.BroadcastReceiver
-keep class * extends android.app.Service
